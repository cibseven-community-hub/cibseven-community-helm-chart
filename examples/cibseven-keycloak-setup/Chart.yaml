# This chart is an EXAMPLE, not a published artifact. Copy the directory into
# your own GitOps repository, adapt `values.yaml` (see README.md) and deploy it
# from there.
#
# The `cibseven` dependency is served from GitHub Pages by the
# cibseven-community-hub/cibseven-community-helm-chart release workflow.
# Pin `version` to a released chart version — see
# https://github.com/cibseven-community-hub/cibseven-community-helm-chart/releases
#
# To test against an unpublished / local copy of the chart, swap the repository
# line for a `file://` relative path, e.g.:
#   repository: "file://../../charts/cibseven"
# ------------------------------------------------------------------------------
dependencies:
  - name: cibseven
    version: 0.0.4
    repository: https://cibseven-community-hub.github.io/cibseven-community-helm-chart
