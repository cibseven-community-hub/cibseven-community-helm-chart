# Default values for cibseven.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

general:
  debug: false
  replicaCount: 1
  nameOverride: ""
  fullnameOverride: ""

# Set deployment initContainers for any pre-startup proposes.
initContainers: []

# Deployment annotations
annotations: {}

# Custom labels to add to all deployed objects
commonLabels: {}
# Example
#  my-custom-label: my-value

image:
  # Defaults to the CIB seven fork of the Camunda 7 engine.
  # The `run-*` distribution is a Spring Boot bundle that ships the
  # cibseven-webclient (Cockpit/Tasklist/Admin) in-process. Use
  # `tomcat-latest` / `wildfly-latest` for the application-server distros.
  repository: cibseven/cibseven
  tag: run4-latest
  pullPolicy: IfNotPresent
  pullSecrets: []
  command: []
  args: []

# Extra environment variables to customize the deployment.
# For more details: https://github.com/cibseven/cibseven-docker
extraEnvs: []
# Example:
# - name: DB_VALIDATE_ON_BORROW
#   value: false

# Extra containers to have sidecars
extraContainers: []

# By default H2 database is used, which is handy for demos and tests,
# however, H2 is not supported in a clustered scenario.
# So for real-world workloads, an external database like PostgreSQL should be used.
database:
  driver: org.h2.Driver
  url: jdbc:h2:./camunda-h2-dbs/process-engine
  credentialsSecretEnabled: true
  credentialsSecretName: ""
  credentialsSecretKeys:
    username: DB_USERNAME
    password: DB_PASSWORD

service:
  enabled: true
  annotations: {}
  port: 8080
  portName: http
  protocol: TCP
  type: ClusterIP
  # NodePort example.
  # type: NodePort
  # nodePort: 30080
  # LoadBalancer example.
  # type: LoadBalancer
  # loadBalancerIP: 0.0.0.0

metrics:
  enabled: false
  service:
    enabled: true
    port: 9404
    portName: metrics
    protocol: TCP
    type: ClusterIP
    annotations:
      prometheus.io/scrape: "true"
      prometheus.io/path: "/"
      prometheus.io/port: "9404"

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# The StartupProbe works with Kubernetes >= 1.6
startupProbe:
  enabled: false
  config:
    httpGet:
      path: /webapp/
      port: http
    initialDelaySeconds: 120
    periodSeconds: 60

readinessProbe:
  enabled: true
  config:
    httpGet:
      path: /webapp/
      port: http
    initialDelaySeconds: 120
    periodSeconds: 60

# An arbitrary use of livenessProbe could make a lot of service interruption, use it wisely.
livenessProbe:
  enabled: false
  config:
    httpGet:
      path: /webapp/
      port: http
    initialDelaySeconds: 120
    periodSeconds: 60

ingress:
  enabled: false
  ingressClassName: ""
  annotations:
    {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: cibseven.local
      paths:
        - /
  tls: []
  #  - secretName: cibseven-tls
  #    hosts:
  #      - cibseven.local

# Recreate the pods on any install, no matter if anything has changed.
# Which is useful to recreate the pod if the image tag has not changed.
recreatePods: false

podAnnotations: {}

podSecurityContext:
  fsGroup: 1000

securityContext:
  {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

resources:
  {}
  # If you do want to specify resources, uncomment the following lines,
  # adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

extraVolumeMounts:
  []
  # - name: dummy-volume
  #   mountPath: /dummy/volume

extraVolumes:
  []
  # - name: dummy-volume
  #   hostPath:
  #     path: /tmp/dummy-volume

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

tests:
  annotations: {}

# ------------------------------------------------------------------------------
# Webclient / Spring Boot application configuration
#
# The `cibseven/cibseven:run-*` image is a Spring Boot process that serves both
# the classic Camunda webapps at /camunda/ and the modern cibseven-webclient at
# /webapp/ from the same JVM. Any property supported by the upstream
# cibseven-webclient application.yaml can be overridden here — LDAP, SSO,
# UI toggles, branding, feature flags, etc. See the upstream reference for the
# full list of keys:
#   https://github.com/cibseven/cibseven-webclient/blob/main/helm/cibseven-webclient/values.yaml
#
# When `applicationYaml` is non-empty the chart renders it verbatim into a
# ConfigMap, mounts it at /opt/cibseven/config/application.yaml, and sets
# SPRING_CONFIG_ADDITIONAL_LOCATION on the engine container so Spring Boot
# merges it on top of the image's built-in defaults.
#
# `tpl` is applied so Helm expressions like `{{ .Release.Name }}` work here.
#
# Example:
#   webclient:
#     applicationYaml: |
#       cibseven:
#         webclient:
#           theme: cib
#           productNamePageTitle: "My CIB seven"
#           ldap:
#             url: ldap://ldap.example.com:389
#             folder: dc=example,dc=com
#             userNameAttribute: uid
#           authentication:
#             tokenValidMinutes: 60
#         ui:
#           supportedLanguages: [en, de]
#           layout:
#             showFeedbackButton: false
# ------------------------------------------------------------------------------
webclient:
  applicationYaml: ""
