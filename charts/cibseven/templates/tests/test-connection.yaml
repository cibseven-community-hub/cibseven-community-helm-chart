apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "cibseven.fullname" . }}-test-connection"
  labels:
    {{- include "cibseven.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    {{- with .Values.tests.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  containers:
    - name: curl
      image: curlimages/curl
      command: ['curl']
      # The engine service could take sometime to start, so setting a retry mechanism.
      args: [
        '--retry-connrefused',
        '--connect-timeout', '5',
        '--max-time', '10',
        '--retry', '15',
        '--retry-max-time', '300',
        '{{ include "cibseven.fullname" . }}:{{ .Values.service.port }}',
      ]
  restartPolicy: Never
